<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1d2547">
<title>바이오 랩 나이트 미션</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout: 한 화면 게임 보드 — 상단 HUD(타이머·시스템 복구율·코드 조각), 가운데 관문 카드, 하단 조작 영역. 밤하늘(체관 속 밤) 단일 테마. */
:root{
  --night:#141a33;      /* 바탕: 체관 속 밤 */
  --night-2:#1d2547;    /* 패널 */
  --night-3:#28325c;    /* 패널 강조 */
  --ink:#eef0ff;        /* 본문 글자 */
  --ink-dim:#a9b0d6;    /* 보조 글자 */
  --sugar:#ff8fc2;      /* 경보 핑크 (강조) */
  --leaf:#7fe0a8;       /* 정답·스마트팜 잎 */
  --amber:#ffc861;      /* 경고·타이머 */
  --danger:#ff6b6b;     /* 오답 */
  --line:rgba(238,240,255,.14);
  --f-display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  background-image:radial-gradient(1px 1px at 12% 18%,rgba(255,255,255,.55) 50%,transparent 51%),radial-gradient(1px 1px at 72% 9%,rgba(255,255,255,.45) 50%,transparent 51%),radial-gradient(1.5px 1.5px at 38% 62%,rgba(255,255,255,.3) 50%,transparent 51%),radial-gradient(1px 1px at 88% 44%,rgba(255,255,255,.4) 50%,transparent 51%),radial-gradient(1px 1px at 22% 84%,rgba(255,255,255,.35) 50%,transparent 51%);
  background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.wrap{max-width:880px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:clamp(30px,7vw,48px)}
h2{font-size:clamp(22px,4.6vw,30px)}
h3{font-size:20px}
p{margin:0}
.dim{color:var(--ink-dim)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:14px;padding:12px 20px;background:var(--sugar);color:#2a0f1f;font-family:var(--f-display);font-size:19px;letter-spacing:.02em;box-shadow:0 4px 0 #c45e8f;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #c45e8f}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:none;border:1.5px solid var(--line)}
.btn.leaf{background:var(--leaf);color:#0d2b1b;box-shadow:0 4px 0 #46a271}
.btn.small{font-size:15px;padding:8px 14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:14px}
.panel{background:var(--night-2);border:1px solid var(--line);border-radius:18px;padding:18px}
.screen{display:grid;gap:18px}
.screen>*,.panel>*,.part>*{min-width:0}
.eyebrow{font-size:13px;letter-spacing:.14em;color:var(--sugar);text-transform:uppercase;font-family:var(--f-mono)}

/* ---------- 관제 AI 플로 ---------- */
.monster{width:150px;height:150px;position:relative;margin:0 auto;flex:none}
.monster svg{width:100%;height:100%;overflow:visible}
.monster.small{width:84px;height:84px}
.monster .body{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.monster.laugh .body{animation:laugh .5s ease-in-out 3}
@keyframes laugh{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.monster.hit .body{animation:hit .5s}
@keyframes hit{20%{transform:translateX(-10px);filter:brightness(2)}60%{transform:translateX(8px)}}
.monster.calm .body{animation:bob 3.6s ease-in-out infinite}

/* ---------- 말풍선 ---------- */
.speech{position:relative;background:var(--night-3);border:1.5px solid var(--sugar);border-radius:16px;padding:14px 16px;font-size:17px}
.speech b{color:var(--sugar);font-weight:400;font-family:var(--f-display)}
.speech-row{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
@media (max-width:520px){.speech-row{grid-template-columns:1fr}.speech-row .monster{width:110px;height:110px}}

/* ---------- 인트로 ---------- */
.intro{min-height:calc(100% - 0px);display:grid;place-items:center;text-align:center;gap:22px;padding-block:24px}
.press{width:150px;height:150px;border-radius:50%;border:3px solid var(--leaf);background:radial-gradient(circle,#2a3a5f 0%,var(--night-2) 70%);position:relative;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;touch-action:none;user-select:none;-webkit-user-select:none}
.press svg{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);transform:rotate(-90deg)}
.press circle{fill:none;stroke:var(--leaf);stroke-width:6;stroke-linecap:round;stroke-dasharray:502;stroke-dashoffset:502}
.scene{max-width:620px;display:grid;gap:16px;text-align:left}
.scene .speech{min-height:96px}
.scene-pic{font-family:var(--f-mono);font-size:14px;color:var(--ink-dim);text-align:center}
.flow{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-display);font-size:20px}
.flow span{padding:6px 12px;border-radius:12px;background:var(--night-3)}
.flow i{font-style:normal;color:var(--sugar)}
.sos{color:var(--danger);font-family:var(--f-display);font-size:28px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.3}}

/* ---------- 설정 ---------- */
.field{display:grid;gap:6px}
.field label{font-size:14px;color:var(--ink-dim)}
.input{width:100%;background:var(--night);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.role{background:var(--night);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:4px}
.role strong{font-family:var(--f-display);font-weight:400;font-size:17px}
.role small{color:var(--ink-dim);font-size:12.5px;line-height:1.4}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(20,26,51,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
.hud-in{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.timer{font-family:var(--f-mono);font-size:26px;font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums;min-width:96px}
.timer.over{color:var(--danger)}
.hp{display:grid;gap:4px}
.hp-label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-dim)}
.hp-bar{height:12px;border-radius:99px;background:var(--night-3);overflow:hidden}
.hp-fill{height:100%;background:linear-gradient(90deg,#46a271,var(--leaf));transition:width .8s ease}
.frags{display:flex;gap:4px}
.frag{width:30px;height:30px;border-radius:8px;border:1.5px dashed var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:16px;color:var(--ink-dim)}
.frag.on{border:1.5px solid var(--amber);color:var(--amber);background:rgba(255,200,97,.1)}
.steps{display:flex;gap:6px;margin-top:8px}
.steps span{flex:1;height:5px;border-radius:99px;background:var(--night-3)}
.steps span.done{background:var(--leaf)}
.steps span.cur{background:var(--sugar)}
@media (max-width:560px){.hud-in{grid-template-columns:auto 1fr}.frags{grid-column:1/-1;justify-content:center}.timer{font-size:22px;min-width:80px}}

/* ---------- 관문 ---------- */
.stage-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.stage-no{font-family:var(--f-mono);color:var(--sugar);font-size:14px;letter-spacing:.1em}
.part{display:grid;gap:14px}
.part-title{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:19px}
.lock-ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--night-3);font-size:14px;font-family:var(--f-mono)}
.part.locked{opacity:.4;pointer-events:none;filter:grayscale(.6)}
.part.cleared .lock-ico{background:var(--leaf);color:#0d2b1b}
.feedback{min-height:24px;font-size:15px}
.feedback.bad{color:var(--danger)}
.feedback.good{color:var(--leaf)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}

/* 카드·탱크 */
.cards{display:flex;flex-wrap:wrap;gap:8px}
.card{border:1.5px solid var(--line);background:var(--night);border-radius:12px;padding:8px 12px;font-size:15.5px;line-height:1.35;text-align:left;transition:transform .1s,border-color .1s}
.card small{display:block;color:var(--ink-dim);font-size:12px}
.card.sel{border-color:var(--amber);background:rgba(255,200,97,.12);transform:translateY(-2px)}
.card.ok{border-color:var(--leaf)}
.tanks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:640px){.tanks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tank{border:2px dashed var(--line);border-radius:14px;padding:10px;min-height:120px;display:flex;flex-direction:column;gap:6px;background:rgba(255,255,255,.02);text-align:left}
.tank.hot{border-color:var(--amber)}
.tank-name{font-family:var(--f-display);font-size:17px}
.tank-sub{font-size:12px;color:var(--ink-dim);font-family:var(--f-mono)}
.tank .card{font-size:14px;padding:6px 8px}
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.pick .card{min-height:56px}
.armory{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.weapon{position:relative;padding-left:40px}
.weapon .no{position:absolute;left:10px;top:9px;font-family:var(--f-mono);font-size:13px;color:var(--ink-dim)}
.weapon.sel .no{color:var(--amber)}

/* 다이얼 */
.dial-box{display:grid;gap:12px;justify-items:center;background:var(--night);border:1px solid var(--line);border-radius:16px;padding:14px}
.dials{display:flex;gap:8px}
.dial{display:grid;grid-template-rows:auto 64px auto;width:56px;touch-action:none;user-select:none;-webkit-user-select:none}
.dial button{background:var(--night-3);border:0;height:34px;border-radius:10px;font-size:16px}
.dial .d{display:grid;place-items:center;font-family:var(--f-mono);font-size:38px;font-weight:700;color:var(--amber);background:#0e1328;border-radius:10px;margin-block:4px;border:1.5px solid var(--line)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;color:var(--ink-dim);max-width:520px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--leaf);flex:none}

/* 영양정보 라벨 */
.labels{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.nl{background:#fff;color:#111;border-radius:6px;padding:10px 12px;font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:13.5px;line-height:1.45}
.nl .pname{font-weight:700;font-size:15px;margin-bottom:6px}
.nl .top{display:flex;justify-content:space-between;align-items:baseline;background:#111;color:#fff;padding:6px 8px;border-radius:3px}
.nl .top b{font-size:16px}
.nl .basis{font-size:12px;padding:4px 0;border-bottom:3px solid #111;display:flex;justify-content:space-between}
.nl table{width:100%;border-collapse:collapse}
.nl td{border-bottom:1px solid #999;padding:3px 0}
.nl td:last-child{text-align:right}
.nl .hl td{font-weight:700}
.nl .note{font-size:11px;margin-top:6px;color:#444}

/* 그래프·차트 */
.graph{width:100%;height:auto;background:var(--night);border-radius:14px;border:1px solid var(--line)}
.q{display:grid;gap:8px}
.q-opts{display:flex;flex-wrap:wrap;gap:8px}
.q-opts .card{min-width:64px;text-align:center}
.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:480px){.charts{grid-template-columns:1fr}}
.chart{background:#f3f6f4;color:#18221c;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.5;border-top:6px solid #4c9a6f}
.chart b{font-family:var(--f-display);font-weight:400;font-size:16px}
.dz{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:640px){.dz{grid-template-columns:repeat(3,minmax(0,1fr))}}
.dz div{text-align:center}
.dz div{background:var(--night);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:14.5px}
.dz span{font-family:var(--f-mono);color:var(--amber);margin-right:6px}

/* 4관문 메뉴 */
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.menu div{background:var(--night);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.5}
.menu b{font-family:var(--f-mono);color:var(--amber);font-weight:700;margin-right:4px}
.intake{display:flex;flex-wrap:wrap;gap:8px}
.intake span{background:var(--night);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:14px}

/* 5관문 */
.pledges{display:grid;gap:10px}
.pledge{display:grid;grid-template-columns:120px 1fr 1fr 1fr;gap:8px;align-items:center}
@media (max-width:680px){.pledge{grid-template-columns:1fr 1fr}.pledge .who{grid-column:1/-1}}
.order-tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{width:64px;height:72px;border-radius:14px;border:2px solid var(--amber);background:rgba(255,200,97,.08);display:grid;place-items:center;font-family:var(--f-display);font-size:30px;color:var(--amber);position:relative}
.tile small{position:absolute;top:2px;left:6px;font-family:var(--f-mono);font-size:12px}
.tile.used{opacity:.25}
.spell{display:flex;gap:8px;justify-content:center;min-height:72px}
.spell .slot{width:64px;height:72px;border-radius:14px;border:2px dashed var(--line);display:grid;place-items:center;font-family:var(--f-display);font-size:30px}

/* 조각 획득 / 오버레이 */
.overlay{position:fixed;inset:0;background:rgba(8,10,24,.82);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--night-2);border:1.5px solid var(--sugar);border-radius:20px;padding:22px;max-width:520px;width:100%;display:grid;gap:14px;text-align:center;max-height:90vh;overflow:auto}
.big-frag{font-family:var(--f-display);font-size:88px;color:var(--amber);line-height:1;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.2);opacity:0}}
.hint-box{background:rgba(255,200,97,.08);border:1px solid var(--amber);border-radius:12px;padding:10px 12px;font-size:15px;text-align:left}

/* 엔딩 */
.ending{text-align:center;display:grid;gap:18px;justify-items:center}
.quote{font-family:var(--f-display);font-size:clamp(22px,5vw,30px);color:var(--sugar);max-width:560px}
.cert{background:#fffaf2;color:#2b2230;border-radius:16px;padding:20px;max-width:520px;width:100%;display:grid;gap:10px;text-align:left;border:6px double #e7a6c6}
.cert h3{text-align:center;font-size:24px;color:#b2457a}
.cert dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
.cert dt{color:#7a6a78}
.cert dd{margin:0;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.drips{height:40px;width:220px;margin:0 auto}

/* 교사 */
.t-tabs{display:flex;gap:6px;flex-wrap:wrap}
.t-tabs button{background:var(--night);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.t-tabs button.on{border-color:var(--sugar);color:var(--sugar)}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
table.t th{color:var(--ink-dim);font-weight:400;font-size:12.5px}
.pill{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12.5px;background:var(--night-3)}
.pill.done{background:var(--leaf);color:#0d2b1b}
.pill.play{background:var(--amber);color:#2b1d00}
.tablet-bar{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;background:var(--night-3);border:1.5px solid var(--leaf);border-radius:14px;padding:10px 14px}
.tablet-bar span{font-size:13px;color:var(--ink-dim)}
.tablet-bar b{font-family:var(--f-display);font-weight:400;font-size:20px;color:var(--leaf)}
.tablet-bar small{font-size:12.5px;color:var(--ink-dim);flex-basis:100%}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:28px;font-size:13px;color:var(--ink-dim)}
.linkish{background:none;border:0;color:var(--ink-dim);text-decoration:underline;padding:4px}

/* ===== 바이오 랩 계기판 테마 ===== */
.warm h2{margin:0;font-size:clamp(22px,3.4vw,30px)}.warm #wSub{margin:0;font-size:14.5px}
/* 교사 대시보드: 한 줄 툴바 + 촘촘한 표 */
.tbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:6px 8px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.02)}
.tbar select.input{max-width:120px!important;padding:6px 10px;font-size:14px;height:auto}
.tb-chk{display:inline-flex;align-items:center;gap:5px;font-size:13px;color:var(--ink-dim);white-space:nowrap}
.tb-chk input{width:16px;height:16px;accent-color:var(--leaf)}
.tb-sep{width:1px;height:22px;background:var(--line);margin:0 2px}
.tb-lab{font-family:var(--f-mono);font-size:11.5px;color:var(--sugar);letter-spacing:.08em}
.tb-btn{font:inherit;font-size:13.5px;color:var(--ink);background:var(--night);border:1px solid var(--line);border-radius:9px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.tb-btn:hover{border-color:var(--sugar)}
.tb-btn.danger{border-color:rgba(255,107,107,.6);color:#ff9b9b}
.tb-info{margin-left:auto;font-size:12.5px;color:var(--ink-dim);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tb-fb{margin:0;min-height:0;font-size:13.5px}
.feedback:empty{display:none}
.aq{padding:7px 12px;gap:6px}
.aq .aq-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.live-tbl table.t td{padding:4px 8px}
.live-tbl table.t th{padding:4px 8px}

.tools{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px;background:rgba(255,255,255,.02)}
.tools-h{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;color:var(--sugar)}
.btn.danger{background:var(--danger);box-shadow:0 4px 0 #a33;color:#fff}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:90;background:#1d2547;color:#fff;border:1px solid var(--leaf);border-radius:12px;padding:10px 16px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.4);transition:opacity .5s}
.toast.off{opacity:0}
/* 프롤로그 시네마 화면 */
.cine{width:100%;max-width:920px;display:grid;gap:14px;text-align:left;margin:0 auto}
.cine-stage{position:relative}
.cine-frame{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#050915;border:2px solid #39436f;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.cine-layer{position:absolute;inset:0;opacity:0;transition:opacity 1s ease}
.cine-layer.on{opacity:1}

.scr{position:relative;border-radius:10px;overflow:hidden;background:#050915}

.scr video{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#000}
.vfb{aspect-ratio:16/9;width:100%}
.vfb svg{display:block;width:100%;height:100%}
.vctl{display:flex;gap:8px;justify-content:flex-end;padding:8px 2px 0}
.vnote{font-size:11.5px;color:var(--ink-dim);font-family:var(--f-mono);padding:6px 6px 0}
.flow-dot{animation:flowx 3.2s linear infinite}
@keyframes flowx{from{transform:translateX(0)}to{transform:translateX(520px)}}
.drawline{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.6s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.rise{animation:rise 6s ease-out infinite alternate}
@keyframes rise{from{transform:translateY(60px)}to{transform:translateY(0)}}
.slidein{animation:slidein 2.4s ease-in-out infinite}
@keyframes slidein{0%{transform:translateX(-40px);opacity:0}40%,100%{transform:none;opacity:1}}
.ticker{animation:tick 9s linear infinite}
@keyframes tick{from{transform:translateX(560px)}to{transform:translateX(-760px)}}
.pulse{animation:ledb 1s ease-in-out infinite}
.tube{display:block;margin:2px auto 6px;width:34px;height:64px}
.gauge{display:grid;grid-template-columns:minmax(0,220px) 1fr;gap:16px;align-items:center}
@media (max-width:560px){.gauge{grid-template-columns:1fr}}
.needle{transform-origin:110px 110px;transition:transform 1.4s cubic-bezier(.3,1.6,.5,1)}
.needle.cal{animation:wob 1.4s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-60deg)}50%{transform:rotate(30deg)}}
.readout{font-family:var(--f-mono);font-size:13px;color:var(--ink-dim);display:grid;gap:6px}
.readout b{font-size:26px;color:var(--leaf);font-weight:700}
.weapon{border-left:6px solid #39436f}
.weapon.sel{border-left-color:var(--leaf)}
.install{height:10px;border-radius:99px;background:var(--night);overflow:hidden;border:1px solid var(--line)}
.install i{display:block;height:100%;width:0;background:linear-gradient(90deg,#46a271,var(--leaf));transition:width 1.6s ease}
.term{overflow-wrap:anywhere;font-family:var(--f-mono);font-size:12.5px;line-height:1.7;color:#9fe8c0;background:#050915;border-radius:10px;padding:10px 12px;max-height:180px;overflow:auto}
.term .er{color:var(--danger)}.term .wa{color:var(--amber)}
.modal.wide{max-width:760px;text-align:left}
.article{background:#f5f6fb;color:#1c1d2b;border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.7}
.article h4{margin:0 0 6px;font-family:var(--f-display);font-weight:400;font-size:21px;color:#1d2547}
.article .src{font-size:12px;color:#5b5d70;margin-top:8px}
.breaking{display:inline-block;background:var(--danger);color:#fff;font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;padding:2px 8px;border-radius:4px;margin-bottom:6px}
.sunrise{position:fixed;inset:auto 0 0 0;height:45vh;pointer-events:none;background:radial-gradient(ellipse at 50% 120%,rgba(255,200,97,.35),transparent 60%);z-index:0}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function watchAll(){ if(!fb.ready||unsub) return; unsub=fb.db.collection(COLLECTION).onSnapshot(function(snap){ liveRows=[]; snap.forEach(function(doc){ liveRows.push(doc.data()); }); fbErrCode=""; if(teacherOn&&(tTab==="live"||tTab==="log")) renderTeacher(); }, function(e){ fbErrMsg(e); unsub=null; if(teacherOn) renderTeacher(); }); }
function sync(){ listenMine(); if(!fb.ready||!S.id) return; clearTimeout(syncTimer); syncTimer=setTimeout(function(){ fb.db.collection(COLLECTION).doc(S.id).set(packState(),{merge:true}).catch(function(e){ console.warn("sync",e); fbErrMsg(e); }); },300); }
function loadScript(src){ return new Promise(function(res,rej){ var s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function initFirebase(){
  if(!CONFIG.firebase||!CONFIG.firebase.apiKey) return;
  var v="10.12.2", base="https://www.gstatic.com/firebasejs/"+v+"/";
  loadScript(base+"firebase-app-compat.js").then(function(){ return loadScript(base+"firebase-firestore-compat.js"); }).then(function(){
    firebase.initializeApp(CONFIG.firebase); fb.db=firebase.firestore(); fb.ready=true; sync(); listenControl(); if(teacherOn) watchAll();
    if(S.phase==="play"&&S.stage===5&&S.approvalRequested&&!S.approved&&padEl){ closePad(); openApprovalPad(); }
  }).catch(function(e){ console.warn("Firebase 연결 실패 — 기기 단독 모드로 계속합니다.",e); });
}

/* ---------- 라우터 ---------- */
function render(){
  finishType();
  if(S.phase==="setup") bgmStart(1500);
  else bgmStop(S.phase==="play"?1500:1200);
  bgmBtn();
  if(teacherOn){ renderTeacher(); return; }
  if(S.phase==="intro") return renderIntro();
  if(S.phase==="setup") return renderSetup();
  if(S.phase==="warmth") return renderWarmth();
  if(S.phase==="end") return renderEnd();
  [null,renderS1,renderS2,renderS3,renderS4,renderS5][Math.min(S.stage,5)]();
}
initFirebase();
render();
</script>
